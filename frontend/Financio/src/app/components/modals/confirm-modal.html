<div class="modal-overlay" *ngIf="mostrar">
  <div class="modal-box">
    <h3>{{ titulo }}</h3>
    <p>{{ mensaje }}</p>
    <div class="modal-actions">
      <button class="btn-cancel" (click)="onCancelar()">{{ textoCancelar }}</button>
      <button class="btn-logout" (click)="onConfirmar()">{{ textoConfirmar }}</button>
    </div>
  </div>
</div>
