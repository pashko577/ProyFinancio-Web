<div class="container mt-4">
  <h2 class="text-center mb-4">📊 Historial de Movimientos</h2>

 <!-- FILTROS -->
<div class="card p-3 mb-3">
  <div class="row g-3">

    <!-- Fecha desde -->
    <div class="col-md-3">
      <label class="form-label fw-semibold">Fecha Desde</label>
      <input type="date" class="form-control" [(ngModel)]="filtroFechaDesde" (change)="aplicarFiltros()">
    </div>

    <!-- Fecha hasta -->
    <div class="col-md-3">
      <label class="form-label fw-semibold">Fecha Hasta</label>
      <input type="date" class="form-control" [(ngModel)]="filtroFechaHasta" (change)="aplicarFiltros()">
    </div>

    <!-- Tipo -->
<div class="col-md-3">
  <label class="form-label fw-semibold">Tipo</label>
  <select class="form-select" [(ngModel)]="filtroTipo" (change)="aplicarFiltros()">
    <option value="">Todos</option>
    <option value="INGRESO">Ingreso</option>
    <option value="GASTO">Gasto</option>
  </select>
</div>

<!-- Categoría -->
<div class="col-md-3">
  <label class="form-label fw-semibold">Categoría</label>
  <select class="form-select" [(ngModel)]="filtroCategoria" (change)="aplicarFiltros()">
    <option value="">Todas</option>
    <option *ngFor="let c of categoriasUnicas" [value]="c">{{ c }}</option>
  </select>
</div>
  </div>
</div>  

  <!-- TABLA -->
  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Tipo</th>
        <th>Categoría</th>
        <th>Descripción</th>
        <th>Monto</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of movimientosFiltrados">
        <td>{{ m.fecha | date:'dd/MM/yyyy HH:mm' }}</td>
        <td>
          <span [class.text-success]="m.tipo === 'INGRESO'"
                [class.text-danger]="m.tipo === 'GASTO'">
            {{ m.tipo }}
          </span>
        </td>
        <td>{{ m.categoria }}</td>
        <td>{{ m.descripcion || '—' }}</td>
        <td>{{ m.monto | currency:'PEN' }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="movimientosFiltrados.length === 0" class="text-center text-muted">
    No hay movimientos con los filtros seleccionados.
  </div>
</div>
