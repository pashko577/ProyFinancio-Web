<div class="container mt-4">
  <h2 class="text-center mb-4">💸 Gestión de Gastos</h2>

  <!-- Formulario de registro -->
  <div class="card p-4 mb-4 form-gasto">
    <h5>Registro de Gastos</h5>
    <form (ngSubmit)="registrarGasto();
      $event.preventDefault()" novalidate>

      <!-- Monto -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Monto</label>
        <input type="number" class="form-control" 
        placeholder="Ej: 250.00" [(ngModel)]="nuevoGasto.monto" name="monto" required>
      </div>

      <!-- Categoría -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Categoría</label>
        <select class="form-select" 
        [(ngModel)]="nuevoGasto.categoria" name="categoria" required>
          <option value="" disabled selected>Seleccione categoría</option>
          <option *ngFor="let c of categorias" [value]="c.id">{{ c.nombre }}</option>
        </select>
      </div>

      <!-- Método de Pago -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Método de Pago</label>
        <select class="form-select" 
        [(ngModel)]="nuevoGasto.metodoPago" name="metodoPago" required>
          <option value="" disabled selected>Seleccione método de pago</option>
          <option *ngFor="let m of metodosPago" [value]="m.id">{{ m.tipo }}</option>
        </select>
      </div>

      <!-- Descripción -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Descripción</label>
        <textarea class="form-control descripcion-input"
                  placeholder="Ej: Pago de servicios, compra de materiales, etc..."
                  [(ngModel)]="nuevoGasto.descripcion"
                  name="descripcion"
                  rows="4"
                  required></textarea>
      </div>

      <button type="submit" class="btn btn-danger w-100">Registrar Gasto</button>
    </form>

    <!-- Mensaje -->
    <div *ngIf="mensaje" class="alert alert-info mt-3 text-center">
      {{ mensaje }}
    </div>
  </div>

  <!-- Tabla de gastos -->
  <div class="card p-3">
    <h5>Lista de Gastos</h5>
    <table class="table table-striped mt-2">
      <thead>
        <tr>
          <th>ID</th>
          <th>Categoría</th>
          <th>Método de Pago</th>
          <th>Descripción</th>
          <th>Monto</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let g of gastos">
          <td>{{ g.id }}</td>
          <td>{{ g.categoria }}</td>
          <td>{{ g.metodoPago }}</td>
          <td>{{ g.descripcion || '—' }}</td>
          <td>{{ g.monto | currency:'PEN' }}</td>
          <td>
            <button class="btn btn-sm btn-outline-danger" (click)="eliminarGasto(g.id)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="gastos.length === 0" class="text-center text-muted mt-2">
      No hay gastos registrados aún.
    </div>
  </div>
</div>
