<div class="app-wrapper">
  <!-- HEADER -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <a class="navbar-brand fw-bold" routerLink="/">Financio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" routerLink="/" routerLinkActive="active">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/services" routerLinkActive="active">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/contact" routerLinkActive="active">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/plans" routerLinkActive="active">Planes</a></li>
        </ul>
        <div class="d-flex align-items-center">
          <ng-container *ngIf="nombreUsuario; else loginButtons">
            <span class="text-light me-3">Hola, <strong>{{ nombreUsuario }}</strong></span>
            <button class="btn btn-outline-light me-2" *ngIf="mostrarBotonPanel" (click)="irAPanel()">Volver a mi Panel</button>
            <button class="btn btn-outline-light" (click)="abrirModal()">Cerrar Sesión</button>
          </ng-container>
          <ng-template #loginButtons>
            <a routerLink="/login" class="btn btn-outline-light me-2">Iniciar Sesión</a>
            <a routerLink="/registrar" class="btn btn-primary">Registrar</a>
          </ng-template>
        </div>
      </div>
    </nav>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>

  <!-- FOOTER -->
    <app-footer></app-footer>
</div>

<!-- MODAL DE CONFIRMACIÓN -->
<app-confirm-modal
  [mostrar]="mostrarModal"
  titulo="Cerrar Sesión"
  mensaje="¿Deseas cerrar sesión y volver a la pantalla de inicio?"
  textoCancelar="Cancelar"
  textoConfirmar="Sí, cerrar sesión"
  (cancelar)="cerrarModal()"
  (confirmar)="logout()"
></app-confirm-modal>
