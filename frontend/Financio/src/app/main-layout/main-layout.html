<!-- Botón hamburguesa solo en móviles -->
<div class="hamburger" (click)="toggleSidebar()" *ngIf="!esSuperadmin">
  <span></span>
  <span></span>
  <span></span>
</div>

<!-- Layout completo solo si no es Superadmin -->
<div class="layout" [class.sidebar-open]="sidebarAbierto" *ngIf="!esSuperadmin">
  
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>Financio</h2>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/ingresos" routerLinkActive="active">Ingresos</a>
      <a routerLink="/gastos" routerLinkActive="active">Gastos</a>
      <a routerLink="/movimientos" routerLinkActive="active">Movimientos</a>
      <a routerLink="/caja" routerLinkActive="active">Caja</a>
      <a routerLink="/metas" routerLinkActive="active">Metas</a>
      <a routerLink="/exportar" routerLinkActive="active">Exportar Datos</a>
      <a *ngIf="rol === 'ADMIN'" routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
      <a (click)="abrirModal()">Cerrar sesión</a>
    </nav>
  </aside>

  <!-- Contenido principal -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Contenido solo para Superadmin -->
<div *ngIf="esSuperadmin" class="content">

  <!-- Menú superior para SuperAdmin -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/dashboard">💼 Financio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSuperAdmin"
        aria-controls="navbarSuperAdmin" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSuperAdmin">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/gestor-usuarios" routerLinkActive="active">Gestor Usuarios</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/gestor-pagos" routerLinkActive="active">Gestor Pagos</a>
          </li>
        </ul>

        <ul class="navbar-nav">
          <li class="nav-item">
            <span class="navbar-text me-3">{{ authService.obtenerUsuario()?.nombre }}</span>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm" (click)="cerrarSesion()">Cerrar sesión</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Aquí van los componentes según la ruta -->
  <router-outlet></router-outlet>
</div>
